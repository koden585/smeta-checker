name: deploy-dev
on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, smeta-dev]
    steps:
      - uses: actions/checkout@v4
      - name: deploy
        run: |
          cd /root/smeta-checker-dev
          sudo git fetch origin
          sudo git reset --hard origin/dev
          sudo /usr/local/bin/smeta-deploy.sh
