name: deploy-dev
on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, smeta-dev]
    steps:
      - uses: actions/checkout@v4
      - name: deploy
        run: |
          {
            echo "=== WHOAMI: $(whoami) ==="
            cd /root/smeta-checker-dev || { echo "CD_FAILED"; exit 1; }
            echo "=== FETCH ==="
            sudo git fetch origin 2>&1
            echo "FETCH_EXIT=$?"
            echo "=== RESET ==="
            sudo git reset --hard origin/dev 2>&1
            echo "RESET_EXIT=$?"
            echo "=== DEPLOY ==="
            sudo /usr/local/bin/smeta-deploy.sh 2>&1
            echo "DEPLOY_EXIT=$?"
          } > /tmp/deploy-debug.log 2>&1
