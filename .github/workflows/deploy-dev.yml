name: deploy-dev
on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: deploy
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            kso@176.197.229.166 \
            'cd /root/smeta-checker-dev && git fetch origin && git reset --hard origin/dev && sudo /usr/local/bin/smeta-deploy.sh'
