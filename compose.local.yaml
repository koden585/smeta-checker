# Local Windows/Docker Desktop launch; use with --env-file .env.local
# and -p smeta-checker-local to keep data separate from other projects.
services:
  api:
    image: smeta-checker-local-backend:dev
    ports: !override
      - "127.0.0.1:${API_PORT:-8000}:8000"
  migrate:
    image: smeta-checker-local-backend:dev
  worker-pdf:
    image: smeta-checker-local-backend:dev
    command: ["celery", "-A", "audit_tasks:worker", "worker", "-Q", "pdf", "-c", "${AUDIT_PDF_CONCURRENCY:-2}", "--loglevel=INFO", "--max-memory-per-child", "1000000", "--max-tasks-per-child", "${AUDIT_MAX_TASKS_PER_CHILD:-50}", "-n", "pdf-worker@%h", "--pidfile", "/tmp/celery-pdf.pid"]
  worker-llm:
    image: smeta-checker-local-llm:dev
    command: ["celery", "-A", "audit_tasks:worker", "worker", "-Q", "llm", "-c", "${AUDIT_LLM_CONCURRENCY:-2}", "--loglevel=INFO", "--max-tasks-per-child", "${AUDIT_MAX_TASKS_PER_CHILD:-50}", "-n", "llm-worker@%h", "--pidfile", "/tmp/celery-llm.pid"]
  task-relay:
    image: smeta-checker-local-llm:dev
  workspace:
    image: smeta-checker-local-workspace:dev
