# issue 22: minimal production system on a CPU-only server.
# One file starts api + workspace (Nuxt) + postgres + redis + pdf/llm workers.
# Secrets: copy .env.example to .env and fill POSTGRES_PASSWORD, AUDIT_API_TOKEN,
# LLM keys (YANDEX_* or ANYMODEL_*). Compose reads .env automatically.
name: smeta-checker

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smeta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-smeta}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-smeta}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # CPU-only server: shared_buffers small, logs bounded.
    command:
      - -c
      - shared_buffers=256MB
      - -c
      - log_min_duration_statement=1000

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: ./backend
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smeta}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-smeta}
    command: ["alembic", "upgrade", "head"]

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smeta}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-smeta}
      BLOB_STORE_URL: file:///srv/smeta/.audit_blobs
      CELERY_BROKER_URL: redis://redis:6379/0
      AUDIT_API_TOKEN: ${AUDIT_API_TOKEN:?Set AUDIT_API_TOKEN in .env}
      YANDEX_CLOUD_API_KEY: ${YANDEX_CLOUD_API_KEY:-}
      YANDEX_CLOUD_FOLDER: ${YANDEX_CLOUD_FOLDER:-}
      YANDEX_CLOUD_MODEL: ${YANDEX_CLOUD_MODEL:-qwen3.6-35b-a3b/latest}
      ANYMODEL_API_KEY: ${ANYMODEL_API_KEY:-}
      ANYMODEL_BASE_URL: ${ANYMODEL_BASE_URL:-https://anymodel.org/v1}
      ANYMODEL_MODEL: ${ANYMODEL_MODEL:-}
      AUDIT_ALLOWED_LLM_HOSTS: ${AUDIT_ALLOWED_LLM_HOSTS:-ai.api.cloud.yandex.net}
      AUDIT_PDF_CONCURRENCY: ${AUDIT_PDF_CONCURRENCY:-2}
      AUDIT_LLM_CONCURRENCY: ${AUDIT_LLM_CONCURRENCY:-8}
      AUDIT_TASK_TIME_LIMIT: ${AUDIT_TASK_TIME_LIMIT:-600}
      AUDIT_TASK_SOFT_TIME_LIMIT: ${AUDIT_TASK_SOFT_TIME_LIMIT:-540}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-production}
    volumes:
      - blobs:/srv/smeta/.audit_blobs
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  workspace:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      NUXT_BACKEND_URL: http://api:8000
      NUXT_BACKEND_TOKEN: ${AUDIT_API_TOKEN:?Set AUDIT_API_TOKEN in .env}
      # Port is published on host loopback only (see ports below); inside the
      # container the peer is the Docker gateway, so the BFF trusts the proxy
      # but keeps Host allowlist, same-origin and session checks.
      NUXT_TRUST_PROXY: "1"
      # Empty = localhost only. LAN IP/hostname = intranet (plain HTTP).
      # Domain = world-facing, requires WORKSPACE_PASSWORD + TLS proxy.
      NUXT_PUBLIC_HOST: ${NUXT_PUBLIC_HOST:-}
      WORKSPACE_PASSWORD: ${WORKSPACE_PASSWORD:-}
    ports:
      - "${WORKSPACE_BIND:-127.0.0.1}:${WORKSPACE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt: [no-new-privileges:true]

  worker-pdf:
    build: ./backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smeta}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-smeta}
      BLOB_STORE_URL: file:///srv/smeta/.audit_blobs
      CELERY_BROKER_URL: redis://redis:6379/0
      YANDEX_CLOUD_API_KEY: ${YANDEX_CLOUD_API_KEY:-}
      YANDEX_CLOUD_FOLDER: ${YANDEX_CLOUD_FOLDER:-}
      YANDEX_CLOUD_MODEL: ${YANDEX_CLOUD_MODEL:-qwen3.6-35b-a3b/latest}
      ANYMODEL_API_KEY: ${ANYMODEL_API_KEY:-}
      ANYMODEL_BASE_URL: ${ANYMODEL_BASE_URL:-https://anymodel.org/v1}
      ANYMODEL_MODEL: ${ANYMODEL_MODEL:-}
      AUDIT_ALLOWED_LLM_HOSTS: ${AUDIT_ALLOWED_LLM_HOSTS:-ai.api.cloud.yandex.net}
      AUDIT_TASK_TIME_LIMIT: ${AUDIT_TASK_TIME_LIMIT:-600}
      AUDIT_TASK_SOFT_TIME_LIMIT: ${AUDIT_TASK_SOFT_TIME_LIMIT:-540}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-production}
    volumes:
      - blobs:/srv/smeta/.audit_blobs
      - pdfcache:/srv/smeta/.audit_cache
    command:
      - celery
      - -A
      - audit_tasks:worker
      - worker
      - -Q
      - pdf
      - -c
      - ${AUDIT_PDF_CONCURRENCY:-2}
      - --max-memory-per-child
      - "1000000"
      - -n
      - pdf-worker@%h
    healthcheck:
      # No celery http endpoint: liveness = process answers inspect ping.
      test: ["CMD-SHELL", "celery -A audit_tasks:worker inspect ping -d pdf-worker@$$(hostname) | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

  worker-llm:
    build: ./backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-smeta}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-smeta}
      BLOB_STORE_URL: file:///srv/smeta/.audit_blobs
      CELERY_BROKER_URL: redis://redis:6379/0
      YANDEX_CLOUD_API_KEY: ${YANDEX_CLOUD_API_KEY:-}
      YANDEX_CLOUD_FOLDER: ${YANDEX_CLOUD_FOLDER:-}
      YANDEX_CLOUD_MODEL: ${YANDEX_CLOUD_MODEL:-qwen3.6-35b-a3b/latest}
      ANYMODEL_API_KEY: ${ANYMODEL_API_KEY:-}
      ANYMODEL_BASE_URL: ${ANYMODEL_BASE_URL:-https://anymodel.org/v1}
      ANYMODEL_MODEL: ${ANYMODEL_MODEL:-}
      AUDIT_ALLOWED_LLM_HOSTS: ${AUDIT_ALLOWED_LLM_HOSTS:-ai.api.cloud.yandex.net}
      AUDIT_TASK_TIME_LIMIT: ${AUDIT_TASK_TIME_LIMIT:-600}
      AUDIT_TASK_SOFT_TIME_LIMIT: ${AUDIT_TASK_SOFT_TIME_LIMIT:-540}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://cloud.langfuse.com}
      LANGFUSE_ENVIRONMENT: ${LANGFUSE_ENVIRONMENT:-production}
    volumes:
      - blobs:/srv/smeta/.audit_blobs
      - pdfcache:/srv/smeta/.audit_cache
    command:
      - celery
      - -A
      - audit_tasks:worker
      - worker
      - -Q
      - llm
      - -c
      - ${AUDIT_LLM_CONCURRENCY:-8}
      - -n
      - llm-worker@%h
    healthcheck:
      test: ["CMD-SHELL", "celery -A audit_tasks:worker inspect ping -d llm-worker@$$(hostname) | grep -q pong"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s

volumes:
  pgdata:
  redisdata:
  blobs:
  pdfcache:
